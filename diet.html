<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Diet Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- FontAwesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha384-rWj9FmWWt3OMqd9vBkWRhFavvVUYalYqGPoMdL1brs/qvvqz88gvLShYa4hKNyqb"
      crossorigin="anonymous"
    />
    <script src="dark-mode.js"></script>
    <script src="api-config.js"></script>
    <script src="api-error-handler.js"></script>
    <script src="offline-support.js"></script>
    <script src="loading-states.js"></script>
    <script src="csv-export.js"></script>
    <script src="form-validation.js"></script>
    <script src="search-filter.js"></script>
  </head>

  <body>
    <!-- NAV -->
    <div id="app-nav"></div>
    <script src="nav.js"></script>

    <div class="container">
      <h1><i class="fas fa-utensils"></i> Diet Log</h1>

      <!-- ADD MEAL & EXPORT -->
      <div class="btn-row">
        <button id="toggleDietFormBtn" class="btn">
          <i class="fas fa-plus"></i> Add Meal
        </button>
        <button id="exportDietBtn" class="btn-export" onclick="exportDietLog()">
          <i class="fas fa-file-export"></i> Export CSV
        </button>
      </div>
      <section class="card" id="dietFormSection" style="display: none">
        <form id="dietForm">
          <div class="grid">
            <label>Date<input type="date" id="date" required /></label>
            <label>Time<input type="time" id="time" required /></label>
            <label>
              Meal Type
              <select id="mealType">
                <option>Meal 1</option>
                <option>Meal 2</option>
                <option>Snack</option>
                <option>Mini Meal</option>
              </select>
            </label>
            <label>Context<input id="context" /></label>
          </div>

          <div class="grid">
            <label>Protein Source<input id="proteinSource" /></label>
            <label>Veggies<input id="veggies" /></label>
            <label>Carbs Food<input id="carbsFood" /></label>
            <label>Fats Food<input id="fatsFood" /></label>
          </div>

          <hr />

          <h3>Meal Builder</h3>

          <div class="grid">
            <select id="foodSelect"></select>
            <input type="number" id="foodQty" placeholder="Grams" />
            <button type="button" onclick="addFoodItem()">Add</button>
          </div>

          <table class="table" id="mealItemsTable"></table>

          <hr />

          <div class="grid">
            <label
              >Calories<input type="number" id="calories" readonly
            /></label>
            <label>Protein<input type="number" id="protein" readonly /></label>
            <label>Carbs<input type="number" id="carbs" readonly /></label>
            <label>Fats<input type="number" id="fats" readonly /></label>
          </div>

          <div class="grid">
            <label
              >Hunger<input type="number" min="1" max="5" id="hunger"
            /></label>
            <label
              >Fullness<input type="number" min="1" max="5" id="fullness"
            /></label>
          </div>

          <label>Notes<textarea id="notes"></textarea></label>

          <button type="submit" class="btn">Save Meal</button>
        </form>
      </section>
      <!-- continue container for the rest of the page -->

      <!-- FILTERS + TOTALS -->
      <section class="filter-panel">
        <div class="card">
          <h3>Filters</h3>

          <label>
            Month
            <select id="monthSelect" onchange="applyMonthFilter()"></select>
          </label>

          <label>
            Date
            <input type="date" id="filterDate" />
          </label>

          <div class="btn-row">
            <button onclick="applyDateFilter()">Apply</button>
            <button onclick="clearDateFilter()">Clear</button>
          </div>
        </div>

        <div
          id="dailyTotals"
          class="card totals-panel"
          style="display: none"
        ></div>
      </section>

      <!-- WEEKLY -->
      <section class="card">
        <h2>📅 Weekly Breakdown</h2>
        <div id="weeklyBreakdown" class="weekly-grid"></div>
      </section>

      <!-- TABLE -->

      <div class="table-container mobile-cards">
        <h2 class="theading">Diet Log</h2>
        <table class="table" id="dietTable"></table>
        <!-- <div class="table-hint">⇆ Swipe to view</div> -->
      </div>
    </div>
    <!-- .container -->

    <script src="global.js"></script>
    <script src="diet.js"></script>
  </body>
</html>
