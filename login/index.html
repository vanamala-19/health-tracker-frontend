<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --line: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --ok: #16a34a;
        --err: #dc2626;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(92vw, 520px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0b1220;
        color: var(--text);
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px 14px;
        border: 1px solid var(--line);
        background: #1f2937;
        color: var(--text);
        border-radius: 8px;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 0.9rem;
      }
      .ok {
        color: var(--ok);
      }
      .err {
        color: var(--err);
      }
      .hidden {
        display: none;
      }
    </style>
    <script src="../api-config.js"></script>
    <script src="../app-utils.js"></script>
  </head>
  <body>
    <main class="card">
      <h1>Login</h1>
      <p>Use this page to login for write access in this browser.</p>

      <form id="vaultForm" autocomplete="off">
        <label for="password">Login Password</label>
        <input id="password" type="password" placeholder="Enter login password" />

        <div class="row">
          <button type="submit">Login</button>
          <button id="clearBtn" type="button">Logout</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </main>

    <script>
      const form = document.getElementById("vaultForm");
      const statusEl = document.getElementById("status");
      const clearBtn = document.getElementById("clearBtn");
      const passwordInput = document.getElementById("password");

      function setStatus(message, ok) {
        statusEl.textContent = message;
        statusEl.className = `status ${ok ? "ok" : "err"}`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = passwordInput.value.trim();
        if (!password) {
          setStatus("Password is required.", false);
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });

          if (!response.ok) {
            throw new Error(`Login failed (${response.status})`);
          }

          setStatus("Login successful. This browser can now write data.", true);
          passwordInput.value = "";
        } catch (error) {
          setStatus(error.message, false);
        }
      });

      clearBtn.addEventListener("click", async () => {
        try {
          await fetch(`${API_BASE_URL}/auth/logout`, {
            method: "POST",
            credentials: "include",
          });
          if (typeof setApiAuthToken === "function") {
            setApiAuthToken("");
          }
          setStatus("Logged out in this browser.", true);
        } catch (error) {
          setStatus("Logout failed.", false);
        }
      });
    </script>
  </body>
</html>
