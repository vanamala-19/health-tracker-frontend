<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Health Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <!-- FontAwesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha384-rWj9FmWWt3OMqd9vBkWRhFavvVUYalYqGPoMdL1brs/qvvqz88gvLShYa4hKNyqb"
      crossorigin="anonymous"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="dark-mode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="api-config.js"></script>
    <script src="app-utils.js"></script>
    <script src="api-error-handler.js"></script>
    <script src="offline-support.js"></script>
    <script src="loading-states.js"></script>
    <script src="csv-export.js"></script>
    <script src="form-validation.js"></script>
  </head>
  <body>
    <!-- NAV -->
    <div id="app-nav"></div>
    <script src="nav.js"></script>

    <!-- center content using a responsive container -->
    <div class="container">
      <h1><i class="fas fa-chart-line"></i> Health Tracker Dashboard</h1>

      <div class="cards">
        <div class="card">
          <h3>🔥 Calories Today</h3>
          <p id="todayCalories">-- / --</p>
          <div class="progress-bg">
            <div class="progress-bar" id="calorieProgress"></div>
          </div>
        </div>

        <div class="card">
          <h3>💪 Protein Today</h3>
          <p id="todayProtein">-- / --</p>
          <small id="proteinRange"></small>
          <div class="progress-bg">
            <div class="progress-bar protein" id="proteinProgress"></div>
          </div>
        </div>

        <div class="card">
          <h3>🏋️ Workouts This Week</h3>
          <p id="workouts">-- / 5</p>
        </div>

        <div class="card">
          <h3>Body Weight (kg)</h3>
          <p id="bodyWeight">--</p>
        </div>
      </div>

      <section>
        <div class="workout-header">
          <button class="nav-btn" onclick="changeDietMonth(-1)">⬅</button>
          <h2 id="dietMonthTitle">Calories & Protein</h2>
          <button class="nav-btn" onclick="changeDietMonth(1)">➡</button>
        </div>
        <canvas id="calorieChart"></canvas>
      </section>

      <section>
        <canvas id="proteinChart"></canvas>
      </section>

      <section>
        <div class="workout-header">
          <button class="nav-btn" onclick="changeWorkoutMonth(-1)">⬅</button>
          <h2 id="workoutTitle">Workout Summary</h2>
          <button class="nav-btn" onclick="changeWorkoutMonth(1)">➡</button>
        </div>

        <div class="workout-heatmap-shell">
          <div class="heatmap-weekdays-row">
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
            <span>Sun</span>
          </div>
          <div id="workoutHeatmap" class="workout-heatmap"></div>
        </div>
        <p>Gym Days: <strong id="wkSets">--</strong></p>
        <div class="grid">
          <label
            >Gym Date<input type="date" id="workoutDate"
          /></label>
          <label
            >Status
            <select id="workoutStatus">
              <option value="Done">Done</option>
              <option value="Skipped">Skipped</option>
            </select>
          </label>
          <button type="button" class="btn" onclick="saveWorkoutStatus()">
            Save Gym Status
          </button>
        </div>

        <div class="legend">
          <span class="dot green"></span> Done
          <span class="dot yellow"></span> Skipped
        </div>
      </section>

      <section class="card">
        <h3>Admin Tools</h3>
        <p class="muted">
          Optional maintenance pages:
          <a href="inventory.html?admin=1">Inventory Admin</a> |
          <a href="shift.html?admin=1">Shift Admin</a>
        </p>
      </section>
    </div>
    <!-- .container -->

    <script src="global.js"></script>
    <script src="script.js"></script>
    <script>
      function CallAndroidToast(msg) {
        if (window.Android && Android.showToast) {
          Android.showToast(msg);
        } else {
          console.log("Android bridge not available");
        }
      }
      function showDeviceInfo() {
        if (window.Android) {
          const info = Android.getDeviceInfo();
          notifySuccess(info);
        } else {
          notifyError("Android bridge not available");
        }
      }
      function fetchSteps() {
        console.log("value: ", window.Health.ping());
        if (window.Health && Health.getSteps()) {
          const steps = Health.getSteps();
          notifySuccess(`Steps: ${steps}`);
          console.log("Steps: ", steps);
          if (steps === -1) {
            console.log("Health data not availabe Yet");
          }
        }
      }
    </script>
  </body>
</html>
